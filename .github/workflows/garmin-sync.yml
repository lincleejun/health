# Sync Garmin data to Neon daily. The login token is stored in the database (public.garmin_token): read at runtime, written back after refresh.
name: garmin-sync

on:
  schedule:
    - cron: "0 15 * * *" # daily at 08:00 PDT / 07:00 PST (GitHub schedules can be delayed by minutes to tens of minutes)
  workflow_dispatch:
    inputs:
      since:
        description: "Re-fetch starting from this date (YYYY-MM-DD); leave empty for incremental"
        required: false

concurrency: garmin-sync # two runs must not refresh the token at the same time

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run health.py garmin-sync ${SINCE:+--since "$SINCE"}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SINCE: ${{ inputs.since }}
