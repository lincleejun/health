services:
  db:
    image: postgres:17
    container_name: health-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: health
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
